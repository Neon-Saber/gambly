<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ bot_name }} dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='r5') }}">
</head>
<body data-gid="{{ gid }}" data-bot-admin="{{ '1' if bot_admin else '0' }}" data-bot-name="{{ bot_name }}">
<div class="app">
  <aside class="side">
    <a class="brand" href="{{ url_for('app_routes.dashboard_home') }}">{% include "_mark.html" %}<span class="brand-name">{{ bot_name }}</span></a>
    <div class="server-chip">
      <div class="av" id="side-icon"></div>
      <div style="min-width:0"><div class="sname" id="side-name">loading</div><div class="ssub" id="side-sub"></div></div>
    </div>
    <div class="side-search">
      <i data-lucide="search"></i>
      <input type="text" id="find" placeholder="find a setting" autocomplete="off">
      <div class="search-hits" id="find-hits" style="display:none"></div>
    </div>

    <div class="side-label">floor</div>
    <button class="nav" data-page="overview"><i data-lucide="layout-dashboard"></i>Overview</button>
    <button class="nav" data-page="players"><i data-lucide="users"></i>Players</button>
    <button class="nav" data-page="bounties" data-server><i data-lucide="crosshair"></i>Bounties</button>

    <div class="side-label" data-server>casino</div>
    <button class="nav" data-page="economy" data-server><i data-lucide="coins"></i>Economy</button>
    <button class="nav" data-page="games" data-server><i data-lucide="dice-5"></i>Games</button>

    <div class="side-label" data-server>server</div>
    <button class="nav" data-page="leveling" data-server><i data-lucide="sparkles"></i>Welcome &amp; levels</button>
    <button class="nav" data-page="logs" data-server><i data-lucide="scroll-text"></i>Logs &amp; tickets</button>
    <button class="nav" data-page="builder" data-server><i data-lucide="hammer"></i>Server builder</button>

    <div class="side-label" data-server>staff</div>
    <button class="nav" data-page="staff" data-server><i data-lucide="shield"></i>Staff &amp; roles<span class="pill">new</span></button>

    <div class="side-label">records</div>
    <button class="nav" data-page="rebirths" data-server><i data-lucide="refresh-ccw"></i>Rebirths</button>
    <button class="nav" data-page="activity"><i data-lucide="history"></i>Activity</button>
    <button class="nav" data-page="personal"><i data-lucide="smartphone"></i>Personal app</button>
    <button class="nav bad" data-page="danger" data-server><i data-lucide="triangle-alert"></i>Danger zone</button>

    <div class="side-foot">
      <a href="{{ url_for('app_routes.dashboard_home') }}">all servers</a>
      <a href="{{ url_for('auth.logout') }}">log out</a>
      <a href="{{ url_for('app_routes.privacy') }}">privacy</a>
    </div>
  </aside>

  <main class="main">
    <section class="page" id="p-overview"></section>
    <section class="page" id="p-players"></section>
    <section class="page" id="p-bounties"></section>
    <section class="page" id="p-economy"></section>
    <section class="page" id="p-games"></section>
    <section class="page" id="p-leveling"></section>
    <section class="page" id="p-logs"></section>
    <section class="page" id="p-builder"></section>
    <section class="page" id="p-staff"></section>
    <section class="page" id="p-rebirths"></section>
    <section class="page" id="p-activity"></section>
    <section class="page" id="p-personal"></section>
    <section class="page" id="p-danger"></section>
  </main>
</div>
<div id="toast-root"></div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="{{ url_for('static', filename='js/api.js', v='r5') }}"></script>
<script src="{{ url_for('static', filename='js/guild.js', v='r5') }}"></script>
</body>
</html>
